# Curated companies to poll for new postings, and their sponsorship policy.
#
# The pipeline polls the `companies` table in applications/sourced_jobs.db.
# Entries here are copied into it on every pass as source 'manual', alongside
# boards found by tools/sourcing/discover_companies.py. Deleting an entry here
# does not remove its row from the table.
#
#   company     Display name used in the dashboard.
#   ats         greenhouse | ashby | lever
#   token       The board slug. Greenhouse: boards.greenhouse.io/<token>
#               Ashby: jobs.ashbyhq.com/<token>
#               Lever: jobs.lever.co/<token>
#   sponsorship yes | no | unknown
#
# On sponsorship: every entry below is `unknown` because no sponsorship policy
# has actually been verified for any of these companies. `unknown` is the
# honest default and it is not a filter — unknown postings still show up in the
# review queue, labeled. Only change an entry to yes/no after confirming it
# from the company directly (a recruiter, or an explicit statement on their
# careers site). Do not guess.
#
# Tokens below were each confirmed to return a live board.

